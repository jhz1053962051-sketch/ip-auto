name: VPN Gate 住宅节点采集

# 24 小时全自动：每 24 小时跑一次；也支持手动触发
on:
  schedule:
    # UTC 03:17 = 北京时间 11:17。GitHub 的 cron 是 UTC，且高峰时段会排队延迟几分钟。
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      countries:
        description: '国家白名单（逗号分隔，all 表示不限）'
        required: false
        default: 'JP,KR,SG'
      max_nodes:
        description: '最多检测多少个节点'
        required: false
        default: '80'
      concurrency:
        description: '并发探测数'
        required: false
        default: '8'

# 只需要写仓库 + 发布 Pages 的权限
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只允许一个实例，避免两轮同时改产物
concurrency:
  group: ip-auto
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 本项目零第三方依赖，不需要 npm ci（也就不会因为 npm 供应链出问题）
      - name: 采集并检测节点
        env:
          # CI 里是直连，不需要本地代理；显式置空覆盖默认值
          IP_AUTO_PROXY: ''
          IP_AUTO_COUNTRIES: ${{ inputs.countries || 'JP,KR,SG' }}
          IP_AUTO_MAX_NODES: ${{ inputs.max_nodes || '80' }}
          IP_AUTO_CONCURRENCY: ${{ inputs.concurrency || '8' }}
          IP_AUTO_TIMEOUT_MS: '22000'
          # VPN Gate 没有的国家（新加坡）走公共代理池支线
          IP_AUTO_PROXY_COUNTRIES: 'SG'
          IP_AUTO_PROXY_MAX: '260'
          # Worker 侧延迟复测：登录 edgetunnel 后台要用管理员密码，走 Secret 注入
          IP_AUTO_ADMIN: ${{ secrets.EDGETUNNEL_ADMIN }}
          IP_AUTO_EDGE_BASE: 'https://ipauto-edge.pages.dev'
          IP_AUTO_WORKER_RANK: '1'
          # 产物里的订阅地址（可选，只用于页面展示）
          IP_AUTO_NODES_URL: ${{ vars.NODES_URL }}
        run: node src/run.mjs

      - name: 展示结果摘要
        run: node scripts/summary.mjs

      # 第二条线：直连节点（不经 Cloudflare / Worker）。
      # 为什么要有它：同一个 http 代理，直连 292ms，绕一圈 CF+Worker 是 983ms。
      # 住宅 SSTP 走不了这条路（Xray 不认 SSTP），所以这条线只补「要快」的场景。
      # 公共代理池波动大，这一步失败或抓不到都不影响主订阅，因此 continue-on-error。
      - name: 生成直连节点（不经 Cloudflare）
        continue-on-error: true
        env:
          IP_AUTO_DOH_PROXY: ''
        run: node scripts/make-direct-sub.mjs --countries JP,KR,SG --max 300 --max-ms 2500

      - name: 检查产物非空
        run: |
          test -s public/nodes.txt || { echo "::error::nodes.txt 为空，本轮没有可用节点"; exit 1; }
          echo "nodes.txt 共 $(grep -c . public/nodes.txt) 行"
          head -5 public/nodes.txt
          if [ -s public/direct/nodes.txt ]; then
            echo "直连节点 $(grep -cE '^[ ]*[0-9]+\.' public/direct/nodes.txt) 个"
          else
            echo "本轮没有直连节点（不影响主订阅）"
          fi

      # 把每轮产物提交回仓库，这样即使 Pages 部署失败也能从 git 里取到历史
      - name: 提交产物
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/ logs/latest.json 2>/dev/null || git add public/
          if git diff --staged --quiet; then
            echo "产物无变化，跳过提交"
          else
            git commit -m "chore: 更新节点 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # ---------- GitHub Pages ----------
      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 输出站点地址
        run: |
          echo "### 订阅地址" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.deployment.outputs.page_url }}nodes.txt" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "站点: ${{ steps.deployment.outputs.page_url }}"
