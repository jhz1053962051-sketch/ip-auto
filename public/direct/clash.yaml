# 直连节点（不经 Cloudflare / Worker）
# 由 ip-auto/scripts/make-direct-sub.mjs 自动生成，每天随流水线刷新
# 延迟列 = 本机直连该代理 CONNECT cloudflare.com:443 → /cdn-cgi/trace 的实测耗时
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

proxies:
  - name: "JP-机房-447ms-140.238.32.108"
    type: http
    server: 140.238.32.108
    port: 3128

  - name: "SG-机房-726ms-4.144.146.21"
    type: http
    server: 4.144.146.21
    port: 80

  - name: "KR-机房-1422ms-43.128.144.133"
    type: http
    server: 43.128.144.133
    port: 18080

  - name: "SG-机房-2148ms-8.219.97.248"
    type: http
    server: 8.219.97.248
    port: 80

proxy-groups:
  - name: "最快"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 60
    proxies:
      - "JP-机房-447ms-140.238.32.108"
      - "SG-机房-726ms-4.144.146.21"
      - "KR-机房-1422ms-43.128.144.133"
      - "SG-机房-2148ms-8.219.97.248"

  - name: "JP"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "JP-机房-447ms-140.238.32.108"

  - name: "SG"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "SG-机房-726ms-4.144.146.21"
      - "SG-机房-2148ms-8.219.97.248"

  - name: "KR"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "KR-机房-1422ms-43.128.144.133"

rules:
  - MATCH,最快
