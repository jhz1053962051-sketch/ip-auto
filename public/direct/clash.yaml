# 直连节点（不经 Cloudflare / Worker）
# 由 ip-auto/scripts/make-direct-sub.mjs 自动生成，每天随流水线刷新
# 延迟列 = 本机直连该代理 CONNECT cloudflare.com:443 → /cdn-cgi/trace 的实测耗时
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

proxies:
  - name: "SG-机房-799ms-4.144.146.21"
    type: http
    server: 4.144.146.21
    port: 80

  - name: "SG-机房-811ms-47.245.117.43"
    type: http
    server: 47.245.117.43
    port: 80

  - name: "SG-机房-817ms-43.134.39.221"
    type: http
    server: 43.134.39.221
    port: 10000

  - name: "SG-机房-2028ms-8.219.97.248"
    type: http
    server: 8.219.97.248
    port: 80

proxy-groups:
  - name: "最快"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 60
    proxies:
      - "SG-机房-799ms-4.144.146.21"
      - "SG-机房-811ms-47.245.117.43"
      - "SG-机房-817ms-43.134.39.221"
      - "SG-机房-2028ms-8.219.97.248"

  - name: "SG"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "SG-机房-799ms-4.144.146.21"
      - "SG-机房-811ms-47.245.117.43"
      - "SG-机房-817ms-43.134.39.221"
      - "SG-机房-2028ms-8.219.97.248"

rules:
  - MATCH,最快
