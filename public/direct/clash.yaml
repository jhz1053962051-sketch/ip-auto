# 直连节点（不经 Cloudflare / Worker）
# 由 ip-auto/scripts/make-direct-sub.mjs 自动生成，每天随流水线刷新
# 延迟列 = 本机直连该代理 CONNECT cloudflare.com:443 → /cdn-cgi/trace 的实测耗时
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

proxies:
  - name: "JP-机房-562ms-8.209.255.13"
    type: http
    server: 8.209.255.13
    port: 3128

  - name: "SG-机房-798ms-4.144.146.21"
    type: http
    server: 4.144.146.21
    port: 80

  - name: "SG-机房-822ms-188.166.178.163"
    type: http
    server: 188.166.178.163
    port: 3129

  - name: "KR-机房-1066ms-43.128.144.133"
    type: http
    server: 43.128.144.133
    port: 18080

  - name: "KR-机房-1108ms-8.213.151.128"
    type: http
    server: 8.213.151.128
    port: 3128

  - name: "JP-机房-1254ms-45.43.60.220"
    type: http
    server: 45.43.60.220
    port: 8080

proxy-groups:
  - name: "最快"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 60
    proxies:
      - "JP-机房-562ms-8.209.255.13"
      - "SG-机房-798ms-4.144.146.21"
      - "SG-机房-822ms-188.166.178.163"
      - "KR-机房-1066ms-43.128.144.133"
      - "KR-机房-1108ms-8.213.151.128"
      - "JP-机房-1254ms-45.43.60.220"

  - name: "JP"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "JP-机房-562ms-8.209.255.13"
      - "JP-机房-1254ms-45.43.60.220"

  - name: "SG"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "SG-机房-798ms-4.144.146.21"
      - "SG-机房-822ms-188.166.178.163"

  - name: "KR"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "KR-机房-1066ms-43.128.144.133"
      - "KR-机房-1108ms-8.213.151.128"

rules:
  - MATCH,最快
