# 直连节点（不经 Cloudflare / Worker）
# 由 ip-auto/scripts/make-direct-sub.mjs 自动生成，每天随流水线刷新
# 延迟列 = 本机直连该代理 CONNECT cloudflare.com:443 → /cdn-cgi/trace 的实测耗时
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

proxies:
  - name: "JP-机房-559ms-140.238.32.108"
    type: http
    server: 140.238.32.108
    port: 3128

  - name: "KR-机房-650ms-211.188.53.248"
    type: http
    server: 211.188.53.248
    port: 80

  - name: "SG-机房-795ms-4.144.146.21"
    type: http
    server: 4.144.146.21
    port: 80

  - name: "SG-机房-829ms-188.166.178.163"
    type: http
    server: 188.166.178.163
    port: 3129

  - name: "SG-机房-881ms-128.199.254.13"
    type: http
    server: 128.199.254.13
    port: 9090

  - name: "KR-机房-1598ms-8.213.151.128"
    type: http
    server: 8.213.151.128
    port: 3128

proxy-groups:
  - name: "最快"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 60
    proxies:
      - "JP-机房-559ms-140.238.32.108"
      - "KR-机房-650ms-211.188.53.248"
      - "SG-机房-795ms-4.144.146.21"
      - "SG-机房-829ms-188.166.178.163"
      - "SG-机房-881ms-128.199.254.13"
      - "KR-机房-1598ms-8.213.151.128"

  - name: "JP"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "JP-机房-559ms-140.238.32.108"

  - name: "KR"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "KR-机房-650ms-211.188.53.248"
      - "KR-机房-1598ms-8.213.151.128"

  - name: "SG"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "SG-机房-795ms-4.144.146.21"
      - "SG-机房-829ms-188.166.178.163"
      - "SG-机房-881ms-128.199.254.13"

rules:
  - MATCH,最快
