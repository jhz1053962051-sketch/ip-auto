# 直连节点（不经 Cloudflare / Worker）
# 由 ip-auto/scripts/make-direct-sub.mjs 自动生成，每天随流水线刷新
# 延迟列 = 本机直连该代理 CONNECT cloudflare.com:443 → /cdn-cgi/trace 的实测耗时
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

proxies:
  - name: "JP-机房-526ms-8.209.255.13"
    type: http
    server: 8.209.255.13
    port: 3128

  - name: "SG-机房-735ms-4.144.146.21"
    type: http
    server: 4.144.146.21
    port: 80

  - name: "SG-机房-741ms-43.159.54.178"
    type: http
    server: 43.159.54.178
    port: 80

  - name: "KR-机房-902ms-8.213.151.128"
    type: http
    server: 8.213.151.128
    port: 3128

  - name: "SG-机房-928ms-103.164.55.81"
    type: http
    server: 103.164.55.81
    port: 3128

  - name: "SG-机房-2011ms-43.156.137.7"
    type: http
    server: 43.156.137.7
    port: 10809

proxy-groups:
  - name: "最快"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 60
    proxies:
      - "JP-机房-526ms-8.209.255.13"
      - "SG-机房-735ms-4.144.146.21"
      - "SG-机房-741ms-43.159.54.178"
      - "KR-机房-902ms-8.213.151.128"
      - "SG-机房-928ms-103.164.55.81"
      - "SG-机房-2011ms-43.156.137.7"

  - name: "JP"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "JP-机房-526ms-8.209.255.13"

  - name: "SG"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "SG-机房-735ms-4.144.146.21"
      - "SG-机房-741ms-43.159.54.178"
      - "SG-机房-928ms-103.164.55.81"
      - "SG-机房-2011ms-43.156.137.7"

  - name: "KR"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "KR-机房-902ms-8.213.151.128"

rules:
  - MATCH,最快
