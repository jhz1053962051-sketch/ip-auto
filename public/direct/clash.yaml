# 直连节点（不经 Cloudflare / Worker）
# 由 ip-auto/scripts/make-direct-sub.mjs 自动生成，每天随流水线刷新
# 延迟列 = 本机直连该代理 CONNECT cloudflare.com:443 → /cdn-cgi/trace 的实测耗时
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

proxies:
  - name: "SG-机房-268ms-4.144.146.21"
    type: http
    server: 4.144.146.21
    port: 80

  - name: "JP-机房-280ms-8.209.255.13"
    type: http
    server: 8.209.255.13
    port: 3128

  - name: "KR-住宅-410ms-222.111.130.73"
    type: http
    server: 222.111.130.73
    port: 8080

  - name: "KR-机房-525ms-8.213.151.128"
    type: http
    server: 8.213.151.128
    port: 3128

  - name: "JP-机房-1305ms-140.238.32.108"
    type: http
    server: 140.238.32.108
    port: 3128

  - name: "SG-机房-2472ms-43.156.137.7"
    type: http
    server: 43.156.137.7
    port: 10809

proxy-groups:
  - name: "最快"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 60
    proxies:
      - "SG-机房-268ms-4.144.146.21"
      - "JP-机房-280ms-8.209.255.13"
      - "KR-住宅-410ms-222.111.130.73"
      - "KR-机房-525ms-8.213.151.128"
      - "JP-机房-1305ms-140.238.32.108"
      - "SG-机房-2472ms-43.156.137.7"

  - name: "SG"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "SG-机房-268ms-4.144.146.21"
      - "SG-机房-2472ms-43.156.137.7"

  - name: "JP"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "JP-机房-280ms-8.209.255.13"
      - "JP-机房-1305ms-140.238.32.108"

  - name: "KR"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "KR-住宅-410ms-222.111.130.73"
      - "KR-机房-525ms-8.213.151.128"

rules:
  - MATCH,最快
