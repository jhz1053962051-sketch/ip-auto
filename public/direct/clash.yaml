# 直连节点（不经 Cloudflare / Worker）
# 由 ip-auto/scripts/make-direct-sub.mjs 自动生成，每天随流水线刷新
# 延迟列 = 本机直连该代理 CONNECT cloudflare.com:443 → /cdn-cgi/trace 的实测耗时
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

proxies:
  - name: "SG-机房-958ms-104.248.151.93"
    type: http
    server: 104.248.151.93
    port: 9090

  - name: "SG-机房-1191ms-4.144.146.21"
    type: http
    server: 4.144.146.21
    port: 80

  - name: "SG-机房-2371ms-128.199.254.13"
    type: http
    server: 128.199.254.13
    port: 9090

proxy-groups:
  - name: "最快"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 60
    proxies:
      - "SG-机房-958ms-104.248.151.93"
      - "SG-机房-1191ms-4.144.146.21"
      - "SG-机房-2371ms-128.199.254.13"

  - name: "SG"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "SG-机房-958ms-104.248.151.93"
      - "SG-机房-1191ms-4.144.146.21"
      - "SG-机房-2371ms-128.199.254.13"

rules:
  - MATCH,最快
